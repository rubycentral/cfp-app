name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        website: ['off', 'on']
    name: test (website ${{ matrix.website }})
    env:
      # Read by the Gemfile too (install_if), so it must be set before
      # setup-ruby runs `bundle install`, not only on the rspec step.
      ENABLE_WEBSITE: ${{ matrix.website == 'on' && '1' || '0' }}

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y curl postgresql-client libpq-dev

      # libvips backs the website engine's ActiveStorage variants (ruby-vips).
      - run: sudo apt-get install --no-install-recommends -y libvips
        if: matrix.website == 'on'

      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          cache-version: website-${{ matrix.website }} # the two legs install different gem sets

      - uses: actions/setup-node@v7
        with:
          cache: 'yarn'

      - name: Run tests
        if: matrix.website == 'off'
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres@localhost:5432/cfp_app_test
        run: bundle e rails db:create db:schema:load assets:precompile spec

      - name: Run tests with the website engine
        if: matrix.website == 'on'
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres@localhost:5432/cfp_app_test
        run: bundle e rails db:create db:schema:load assets:precompile && bundle e rspec spec engines/cfp_website/spec

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots-${{ matrix.website }}
          path: ${{ github.workspace }}/tmp/capybara
          if-no-files-found: ignore
