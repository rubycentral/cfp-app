# Dependabot version updates. Options: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# Two defaults are overridden for gems and npm packages:
# - Dependabot waits three days after a release before proposing it; cooldown 0 removes the wait.
# - Only dependencies named in the manifest are updated; "all" includes transitive ones, which
#   is where most of `bundle outdated` comes from. Each still gets its own PR.

version: 2
updates:
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 0
    allow:
      - dependency-type: "all"
    open-pull-requests-limit: 10

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 0
    allow:
      - dependency-type: "all"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
